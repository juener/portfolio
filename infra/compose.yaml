name: portfolio-infra-${ENV}

services:
  portfolio-postgres:
    image: postgres:17.6
    container_name: portfolio-infra-postgres-${ENV}
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

    volumes:
      - postgres_data:/var/lib/postgresql/data
      
    networks:
      - shared-network

  portfolio-redis:
    image: redis:7.4-alpine
    container_name: portfolio-infra-redis-${ENV}
    restart: unless-stopped

    # ports:
    #   - "6379:6379"

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - shared-network

volumes:
  postgres_data:
    name: portfolio-infra-postgres-${ENV}

networks:
  shared-network:
    external: true
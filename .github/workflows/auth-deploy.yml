name: Deploy Auth to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'auth/**'
      - '!auth/nextjs/**'
      - '.github/workflows/auth-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

defaults:
  run:
    working-directory: auth

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: testtest
      S3_BUCKET: portfolio
      S3_FORCE_PATH_STYLE: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            auth/package-lock.json
            auth/nestjs/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install NestJS dependencies
        working-directory: auth/nestjs
        run: npm ci

      - name: Run NestJS lint
        working-directory: auth/nestjs
        run: npm run lint:check

      - name: Run NestJS tests
        working-directory: auth/nestjs
        run: npm test

  image:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Image name
        id: meta
        working-directory: .
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "repo=ghcr.io/${owner}/portfolio-auth" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: auth/nestjs
          file: auth/nestjs/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ steps.meta.outputs.repo }}:${{ github.sha }}
            ${{ steps.meta.outputs.repo }}:${{ github.ref_name }}

  deploy-prod:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: HOSTINGER_VPS

    steps:
      - name: Deploy production to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -eu

            AUTH_IMAGE="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/portfolio-auth:${{ github.sha }}"
            GHCR_USER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
            export AUTH_IMAGE

            API=portfolio-auth-nestjs-prod
            COMPOSE=compose.prod.yaml

            cd /home/_/com.vallete/portfolio-prod
            git fetch origin main
            git sparse-checkout init --no-cone
            git sparse-checkout set '/*' '!/backend/nextjs/' '!/auth/nextjs/' '!/messenger-app/nextjs/'
            git reset --hard origin/main
            rm -rf backend/nextjs auth/nextjs messenger-app/nextjs
            cd auth

            SHA="$(git rev-parse --short HEAD)"
            echo "==> Deploying auth production @ ${SHA}"
            echo "==> image=${AUTH_IMAGE}"

            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            echo "==> 1/3 Pull API image"
            docker compose -f "$COMPOSE" pull "$API" </dev/null

            echo "==> 2/3 Prisma migrate deploy"
            docker compose -f "$COMPOSE" run --rm -T "$API" npx prisma migrate deploy </dev/null

            echo "==> 3/3 Recreate API container"
            docker compose -f "$COMPOSE" up -d --force-recreate --no-deps "$API" </dev/null

            docker logout ghcr.io >/dev/null 2>&1 || true

            echo "==> Verify"
            docker compose -f "$COMPOSE" ps </dev/null

            STARTED="$(docker inspect -f '{{.State.StartedAt}}' "$API")"
            AGE=$(( $(date +%s) - $(date -d "$STARTED" +%s) ))
            echo "git_sha=${SHA} started=${STARTED} age_seconds=${AGE}"

            test "$(docker inspect -f '{{.State.Status}}' "$API")" = running

            if [ "$AGE" -gt 300 ]; then
              echo "ERROR: $API was not recreated (running for ${AGE}s)"
              exit 1
            fi

            for i in 1 2 3 4 5 6 7 8 9; do
              health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$API")"
              echo "health=${health:-starting}"
              if [ "$health" = healthy ]; then break; fi
              if [ "$health" = unhealthy ]; then
                docker compose -f "$COMPOSE" logs --tail=80 "$API" </dev/null
                exit 1
              fi
              sleep 10
            done

            test "$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$API")" = healthy
            echo "==> Deploy OK @ ${SHA}"

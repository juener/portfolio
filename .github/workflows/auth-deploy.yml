name: Deploy Auth to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'auth/nestjs/**'
      - 'auth/compose.prod.yaml'
      - 'auth/package.json'
      - 'auth/package-lock.json'
      - '.github/workflows/auth-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth/nestjs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            auth/package-lock.json
            auth/nestjs/package-lock.json

      - run: npm ci --prefix ..
      - run: npm ci
      - run: npm run lint:check
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: auth/nestjs
          push: true
          provenance: false
          tags: |
            ghcr.io/juener/portfolio-auth:${{ github.sha }}
            ghcr.io/juener/portfolio-auth:${{ github.ref_name }}

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: HOSTINGER_VPS

    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: auth/compose.prod.yaml
          target: /home/_/com.vallete/portfolio-prod/auth
          strip_components: 1

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            export AUTH_IMAGE=ghcr.io/juener/portfolio-auth:${{ github.sha }}
            cd /home/_/com.vallete/portfolio-prod/auth

            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f compose.prod.yaml pull </dev/null
            docker logout ghcr.io

            docker compose -f compose.prod.yaml run --rm -T portfolio-auth-nestjs-prod npx prisma migrate deploy </dev/null
            docker compose -f compose.prod.yaml up -d --force-recreate --wait </dev/null
            docker compose -f compose.prod.yaml ps </dev/null
